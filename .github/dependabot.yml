# Keeps GitHub Actions pins current. Third-party actions are pinned to commit
# SHAs with a `# vX.Y.Z` comment (see SECURITY.md); Dependabot bumps both the
# SHA and the comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only scans .github/workflows/; the composite actions each live in
    # their own directory, so they are matched explicitly via the glob.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Monday 06:00 UTC — before the daily update checks (09:00/10:00 UTC)
      # and after the weekly fuzz run (Monday 04:00 UTC).
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for all action bumps (grouping spans all `directories` above).
      github-actions:
        patterns:
          - "*"
    ignore:
      # dtolnay/rust-toolchain has no versioned releases — it is pinned to a
      # master SHA and the toolchain is selected via the `toolchain:` input.
      # Bumped manually during security backports.
      - dependency-name: "dtolnay/rust-toolchain"

  # The published package's own constraints — the ones that reach a consumer's
  # resolver. Watching them is the lesson of a real incident: a caret on
  # `flutter_rust_bridge` let a new minor into the published archive with nobody
  # deciding anything, and no ecosystem here was watched, so there was no pull
  # request to review either. The constraint is exact now, which stops the
  # silent half; this is the half that says a new version exists.
  #
  # Only the package root. example/, example_cli/ and rust/fuzz/ are not
  # published and their drift cannot reach a consumer, while each extra
  # directory multiplies the weekly pull requests against a repository whose
  # four-platform matrix is the scarce resource.
  - package-ecosystem: "pub"
    directory: "/"
    # Without this, pub's default strategy is `widen` — "extend only the upper
    # bound to include the new version" — and it applies that across the whole
    # manifest, not only to what it is updating. Measured on the first run: a
    # pull request updating four other packages also rewrote
    # `flutter_rust_bridge: ">=X.Y.Z <X.Y.Z+1"` to a caret, which is the exact
    # constraint that must not float, and widened `lints`, `ffigen` and `hooks`
    # past bounds set on purpose. `ignore` does not protect against this: it
    # stops Dependabot opening a pull request *for* a dependency, not editing
    # that dependency's constraint while it edits the file for other reasons.
    # `increase-if-necessary` leaves a constraint alone when it already admits
    # the new version, so an untouched dependency stays untouched.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch only. A major is a migration, not a bump, and grouping
      # one with everything else blocks the rest: the first run here offered
      # `ffigen` 20 -> 21 and `hooks` 1 -> 2 alongside two harmless minors, and
      # one unmergeable entry takes the whole pull request down. Majors still
      # arrive, one pull request each, where they can be judged on their own.
      pub:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Not a one-file bump, so a pull request that edits one file is wrong by
      # construction. The version has to move in four places at once — this
      # constraint, `frb_version` in .copier-answers.yml, FRB_CODEGEN_VERSION
      # in the Makefile and the `=` pin in rust/Cargo.toml — and the bindings
      # in lib/src/rust/ have to be regenerated by that exact codegen, because
      # the runtime asserts its own version equals the one recorded in them.
      # `make setup-frb-codegen` + `make codegen` is the procedure.
      - dependency-name: "flutter_rust_bridge"

      # The build-hook protocol packages. Majors are blocked by the pinned
      # Flutter SDK rather than by anything in this repository, so the pull
      # request cannot be merged and cannot be fixed here either: hooks >= 2.1.0
      # pulls `record_use ^1.0.0`, which needs `meta ^1.19.0`, while Flutter
      # 3.38.4 pins `meta: 1.17.0` exactly (packages/flutter/pubspec.yaml). The
      # first stable SDK to relax that is 3.47.0.
      #
      # Ignoring rather than merging-and-fixing, because the damage is not
      # local: the root package resolves fine — it has no `flutter: sdk`
      # dependency — so a bump breaks `example/` and every Flutter *consumer* on
      # an SDK that pins meta below 1.19.0, while this repository's own CI looks
      # merely red. code_assets 2.0.0 requires hooks ^2.2.0, so the two move
      # together and ignoring one alone only changes which pull request arrives.
      #
      # ⚠ Written as `update-types` rather than `versions: ["2.x"]` on purpose.
      # A wildcard is not a version requirement: this template already shipped
      # `versions: ["1.8.x"]` for a GitHub Action, and Dependabot parsed it
      # through `Gem::Requirement`, which has no wildcard expansion — the entry
      # matched nothing at all and the bot went on proposing the bump while the
      # ignore sat in the file looking like protection. `update-types` needs no
      # parsing of a version string and says what is meant: no majors.
      #
      # Lift when .fvmrc moves to Flutter >= 3.47.0. pubspec.yaml says the same
      # thing in its own comment ("Majors are a deliberate migration, not a
      # bump"); this is what stops the proposal arriving weekly in the meantime.
      - dependency-name: "hooks"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "code_assets"
        update-types:
          - "version-update:semver-major"

  # The native crate's dependencies. These are compiled into the binary the
  # build hook downloads, so a vulnerable transitive crate reaches consumers as
  # shipped code rather than as a build-time inconvenience — `make rust-audit`
  # already fails on one, and this is how the fix arrives.
  #
  # The upstream crates are ignored rather than left to chance. They are git
  # dependencies pinned to a tag, and Dependabot's cargo updater does follow git
  # refs — so without this it would open its own pull request for the same bump
  # that check-libsignal-updates.yml exists to make, with none of the
  # work that one does: no `make codegen`, no bindings tripwire, no CHANGELOG
  # entry, no version badge. Two pull requests for one upstream release, and the
  # cheaper one merges first.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch only, and it separates more than that name suggests.
      # Dependabot's commit trailers call a 0.x bump `semver-minor` — `rand`
      # 0.9 -> 0.10 and `rusqlite` 0.34 -> 0.40 both say so — but its *grouping*
      # applies Cargo's own reading, where a 0.x minor is the breaking bump,
      # and keeps them out of a minor+patch group anyway. Measured on the first
      # run after this landed: a six-crate group became a group of two (`log`
      # patch, `uuid` 1.x minor) plus one pull request each for `rand`, `sha2`,
      # `hkdf` and `aes-gcm-siv`. Read the version string, not the trailer.
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Same coordinated bump as the pub entry above — see the note there.
      - dependency-name: "flutter_rust_bridge"
      - dependency-name: "libsignal-protocol"
      - dependency-name: "libsignal-core"
      - dependency-name: "signal-crypto"

      # `rand` tracks libsignal's, not the newest. An `OsRng` is handed by
      # `&mut` straight into libsignal's own `Rng + CryptoRng` bounds at 19
      # call sites across rust/src/api/{keys,kyber,group_session,
      # session_builder,session_cipher,sealed_sender}.rs, and those bounds are
      # rand 0.9's traits — libsignal-protocol and libsignal-core both resolve
      # rand 0.9.5, as does spqr. A 0.10 `UnwrapErr<OsRng>` implements rand
      # 0.10's `RngCore`, which is a different trait, so every one of those
      # calls stops compiling. Delete this entry once upstream's own Cargo.toml
      # says 0.10; bumping ahead of it would mean carrying rand twice under an
      # alias purely to keep a type that libsignal already provides.
      #
      # rand 0.10.2 being *in* Cargo.lock is not an argument for the bump: it
      # arrives on a disjoint path (libcrux-traits, hpke-rs-crypto and
      # core-models), where it never meets these call sites. Two majors of a
      # crate coexisting in the graph is normal; unifying them is the breakage.
      #
      # A `versions` range rather than `update-types`, for the reason the group
      # note above already gives: Dependabot's trailers call 0.9 -> 0.10
      # `semver-minor`, so an ignore written against majors would never fire.
      - dependency-name: "rand"
        versions:
          - ">= 0.10.0"
