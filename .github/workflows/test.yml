# Run tests on multiple platforms
#
# Triggers:
# - Manual dispatch (workflow_dispatch)
# - Push to main or develop branches (relevant files)
# - Pull requests (relevant files)
# - After successful build-precompiled workflow (native binaries updated)
#
# Platforms: Linux x86_64, Linux ARM64, macOS ARM64, Windows x86_64
#
# Note: Native libraries are built automatically by Cargokit during Flutter build.
# Precompiled binaries are downloaded from GitHub Releases if available.

name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'pubspec.yaml'
      - '.github/workflows/test.yml'
      - '.github/workflows/test-reusable.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'pubspec.yaml'
  workflow_run:
    workflows: ["Build Precompiled Binaries"]
    types:
      - completed

jobs:
  test:
    # Skip tests for failed workflow_run triggers
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/test-reusable.yml
    with:
      run-coverage: true
      update-badge: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
