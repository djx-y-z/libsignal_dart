# Run tests and static analysis
#
# Triggers:
# - Push to main or develop branches (relevant files)
# - Pull requests (relevant files)
# - After successful build-libsignal workflow

name: Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
  workflow_run:
    workflows: ["Build libsignal Native Libraries"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run on completed workflow if it was successful
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Get dependencies
        run: make get

      - name: Analyze
        run: make analyze ARGS="--fatal-infos"

      - name: Check formatting
        run: make format-check

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: make coverage

      - name: Calculate coverage percentage
        id: coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | sed 's/.*: //' | sed 's/%.*//')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90
