# Automatically check for new libsignal releases and update the package
#
# This workflow:
# 1. Runs daily (or manually) to check for new libsignal releases
# 2. Compares with current libsignal.native_version in pubspec.yaml
# 3. If newer version found:
#    - Analyzes release notes with AI (GitHub Models)
#    - Determines appropriate version bump (major/minor/patch)
#    - Updates pubspec.yaml and CHANGELOG.md
#    - Creates PR with AI-generated analysis
# 4. The PR merge triggers build-libsignal.yml to build native libraries

name: Check libsignal Updates

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is the same'
        required: false
        default: false
        type: boolean
      target_version:
        description: 'Specific version to update to (leave empty for latest)'
        required: false
        default: ''
        type: string
      skip_ai_analysis:
        description: 'Skip AI analysis (faster, but less detailed)'
        required: false
        default: false
        type: boolean

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read  # Required for GitHub Models

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Build arguments
          ARGS="--ci"

          if [ -n "${{ inputs.target_version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.target_version }}"
          fi

          if [ "${{ inputs.force_update }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.skip_ai_analysis }}" = "true" ]; then
            ARGS="$ARGS --no-ai"
          fi

          echo "Running: make check ARGS=\"$ARGS\""
          make check ARGS="$ARGS" || true

          echo "Check completed. Outputs:"
          cat $GITHUB_OUTPUT || true

      - name: Update files
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Build arguments for update
          ARGS="--update --ci"

          if [ -n "${{ inputs.target_version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.target_version }}"
          fi

          if [ "${{ inputs.force_update }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.skip_ai_analysis }}" = "true" ]; then
            ARGS="$ARGS --no-ai"
          fi

          echo "Running: make check ARGS=\"$ARGS\""
          make check ARGS="$ARGS"

      - name: Prepare PR body
        if: steps.check.outputs.needs_update == 'true'
        id: pr_body
        run: |
          IS_RC="${{ steps.check.outputs.is_rc }}"
          AI_AVAILABLE="${{ steps.check.outputs.ai_available }}"
          BREAKING_CHANGES="${{ steps.check.outputs.breaking_changes }}"
          BINDING_CHANGES="${{ steps.check.outputs.binding_changes }}"

          # Build PR body
          cat > /tmp/pr_body.md << 'PREOF'
          ## Automated libsignal Update

          This PR updates the libsignal native library to version **${{ steps.check.outputs.latest_version }}**.

          ### Version Changes
          | Component | Old | New |
          |-----------|-----|-----|
          | libsignal | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |
          | Package | ${{ steps.check.outputs.pkg_current }} | ${{ steps.check.outputs.pkg_new }} |
          | Bump Type | - | ${{ steps.check.outputs.bump_type }} |

          PREOF

          if [ "$IS_RC" = "true" ]; then
            cat >> /tmp/pr_body.md << 'PREOF'

          > **Pre-release Version**: This includes a release candidate of libsignal.
          > Consider waiting for stable release unless you need specific features.

          PREOF
          fi

          if [ "$AI_AVAILABLE" = "true" ]; then
            cat >> /tmp/pr_body.md << EOF

          ### AI Analysis

          **Model:** ${{ steps.check.outputs.ai_model }}

          **Breaking Changes:** $BREAKING_CHANGES

          **Binding Changes Needed:** $BINDING_CHANGES

          EOF
          fi

          cat >> /tmp/pr_body.md << 'PREOF'

          ### Release Notes
          See [libsignal ${{ steps.check.outputs.latest_version }} release notes](${{ steps.check.outputs.release_url }})

          ### Review Checklist

          Before merging, please verify:
          - [ ] Review libsignal release notes for breaking changes
          - [ ] Check if FFI bindings need regeneration (`make regen`)
          - [ ] Verify no security vulnerabilities in the new version
          - [ ] Run tests locally if bindings changed

          ### What happens after merge

          1. The `build-libsignal.yml` workflow will automatically trigger
          2. Native libraries will be built for all platforms
          3. A GitHub Release will be created with pre-built binaries

          ---
          This PR was created automatically by the libsignal update checker.
          PREOF

          # Output PR body
          {
            echo 'body<<EOF'
            cat /tmp/pr_body.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            Update libsignal to ${{ steps.check.outputs.latest_version }}

            - Package version: ${{ steps.check.outputs.pkg_current }} -> ${{ steps.check.outputs.pkg_new }}
            - Bump type: ${{ steps.check.outputs.bump_type }}
          title: "Update libsignal to ${{ steps.check.outputs.latest_version }}"
          body: ${{ steps.pr_body.outputs.body }}
          branch: update-libsignal-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.check.outputs.is_rc == 'true' && 'pre-release' || '' }}

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "## Update Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Current libsignal | ${{ steps.check.outputs.current_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| New libsignal | ${{ steps.check.outputs.latest_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Package version | ${{ steps.check.outputs.pkg_current }} -> ${{ steps.check.outputs.pkg_new }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Bump type | ${{ steps.check.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Pre-release | ${{ steps.check.outputs.is_prerelease }} |" >> $GITHUB_STEP_SUMMARY
            echo "| AI Analysis | ${{ steps.check.outputs.ai_available }} |" >> $GITHUB_STEP_SUMMARY
            echo "| AI Model | ${{ steps.check.outputs.ai_model }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A pull request has been created for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Current version **${{ steps.check.outputs.current_version }}** is the latest." >> $GITHUB_STEP_SUMMARY
          fi
