# Automatically check for new libsignal releases and create PR to update rust/Cargo.toml
#
# This workflow:
# 1. Runs daily (or manually) to check for new libsignal releases
# 2. Compares with current libsignal-protocol tag in rust/Cargo.toml
# 3. If newer version found, updates rust/Cargo.toml and creates a PR
# 4. After merge, run tests to verify everything works

name: Check libsignal Updates

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is the same'
        required: false
        default: false
        type: boolean
      target_version:
        description: 'Specific version to update to (leave empty for latest)'
        required: false
        default: ''
        type: string

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup FVM and Flutter
        uses: ./.github/actions/setup-fvm

      - name: Check for updates
        id: check
        run: |
          # Build arguments
          ARGS="--ci"

          if [ -n "${{ inputs.target_version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.target_version }}"
          fi

          if [ "${{ inputs.force_update }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check-new-libsignal-version ARGS=\"$ARGS\""
          make check-new-libsignal-version ARGS="$ARGS" || true

          echo "Check completed. Outputs:"
          cat $GITHUB_OUTPUT || true

      - name: Update rust/Cargo.toml
        if: steps.check.outputs.needs_update == 'true'
        run: |
          # Build arguments for update
          ARGS="--update --ci"

          if [ -n "${{ inputs.target_version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.target_version }}"
          fi

          if [ "${{ inputs.force_update }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: make check-new-libsignal-version ARGS=\"$ARGS\""
          make check-new-libsignal-version ARGS="$ARGS"

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: |
            chore(deps): update libsignal to ${{ steps.check.outputs.latest_version }}
          title: "Update libsignal to ${{ steps.check.outputs.latest_version }}"
          body: |
            ## Automated libsignal Update

            This PR updates the libsignal dependency version.

            ### Version Change

            | Component | Old | New |
            |-----------|-----|-----|
            | libsignal | ${{ steps.check.outputs.current_version }} | ${{ steps.check.outputs.latest_version }} |

            ${{ steps.check.outputs.is_prerelease == 'true' && '> **Pre-release**: This is a release candidate. Consider waiting for stable release unless you need specific features.' || '' }}

            ### Files Updated Automatically

            - `rust/Cargo.toml` — libsignal dependency tags
            - `README.md` — version badge
            - `CLAUDE.md` — example in documentation
            - `.claude/skills/update-libsignal/SKILL.md` — example in skill

            ### Release Notes

            See [libsignal ${{ steps.check.outputs.latest_version }} release notes](${{ steps.check.outputs.release_url }})

            ### After Merge

            1. **Update Cargo.lock:**
               ```bash
               cd rust && cargo update && cd ..
               ```

            2. **Regenerate FRB bindings** (if API changed):
               ```bash
               make codegen
               ```

            3. **Update CHANGELOG.md** with appropriate version entry

            4. **Bump `rust/Cargo.toml` version**:
               ```toml
               version = "X.Y.Z"  # e.g., 1.0.0 → 1.0.1
               ```

            5. **Run tests to verify:**
               ```bash
               make test
               ```

            6. **Commit and push all changes:**
               ```bash
               git add .
               git commit -m "chore: complete libsignal ${{ steps.check.outputs.latest_version }} update"
               git push
               ```

            ---
            *This PR was created automatically by the libsignal update checker.*
          branch: update-libsignal-${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ steps.check.outputs.is_prerelease == 'true' && 'pre-release' || '' }}

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "## Update Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Current libsignal | ${{ steps.check.outputs.current_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| New libsignal | ${{ steps.check.outputs.latest_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Pre-release | ${{ steps.check.outputs.is_prerelease }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A pull request has been created for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Current version **${{ steps.check.outputs.current_version }}** is the latest." >> $GITHUB_STEP_SUMMARY
          fi
