name: Setup Make
description: Install GNU Make for the current platform (Windows only, pre-installed on Linux/macOS)

runs:
  using: composite
  steps:
    - name: Install Make (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download make directly from GitHub releases (more reliable than Chocolatey)
        # Source: https://github.com/mbuilov/gnumake-windows
        $makeVersion = "4.4.1"
        $makeZip = "gnumake-$makeVersion-win64.zip"
        $makeUrl = "https://github.com/mbuilov/gnumake-windows/releases/download/$makeVersion/$makeZip"
        $makeDir = "$env:RUNNER_TEMP\make"

        Write-Output "Downloading GNU Make $makeVersion from GitHub..."
        Invoke-WebRequest -Uri $makeUrl -OutFile "$env:RUNNER_TEMP\$makeZip"

        Write-Output "Extracting to $makeDir..."
        Expand-Archive -Path "$env:RUNNER_TEMP\$makeZip" -DestinationPath $makeDir -Force

        # The archive contains gnumake-4.4.1-win64/make.exe
        $makeBin = "$makeDir\gnumake-$makeVersion-win64"

        Write-Output "$makeBin" >> $env:GITHUB_PATH

        Write-Output "Make path: $makeBin\make.exe"
        & "$makeBin\make.exe" --version
      shell: pwsh
