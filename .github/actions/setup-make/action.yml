name: Setup Make
description: Install GNU Make for the current platform (Windows only, pre-installed on Linux/macOS)

runs:
  using: composite
  steps:
    - name: Install Make (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download make directly from GitHub releases (more reliable than Chocolatey)
        # Source: https://github.com/dcvdh/make-for-windows
        $makeVersion = "4.4.1"
        # Use gnumake.exe (unpatched official version, not the busybox-patched make.exe)
        $makeUrl = "https://github.com/dcvdh/make-for-windows/releases/download/$makeVersion/gnumake.exe"
        $makeDir = "$env:RUNNER_TEMP\make"

        Write-Output "Downloading GNU Make $makeVersion from GitHub..."
        New-Item -ItemType Directory -Path $makeDir -Force | Out-Null
        # Download as make.exe so the 'make' command works
        Invoke-WebRequest -Uri $makeUrl -OutFile "$makeDir\make.exe"

        Write-Output "$makeDir" >> $env:GITHUB_PATH

        Write-Output "Make path: $makeDir\make.exe"
        & "$makeDir\make.exe" --version
      shell: pwsh
