[package]
name = "libsignal_frb"
version = "6.1.3"
edition = "2024"
rust-version = "1.88"
description = "Flutter Rust Bridge bindings for libsignal"
repository = "https://github.com/djx-y-z/libsignal_dart"
license = "AGPL-3.0"
publish = false  # Internal crate, not published to crates.io

[lib]
name = "libsignal_frb"
# rlib is required so the fuzz crate (rust/fuzz) can link against this crate
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
thiserror = "2.0"
log = "0.4"
rand = "0.9"

# Official Signal Protocol libraries (AGPL-3.0)
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.101.2" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.101.2" }
signal-crypto = { git = "https://github.com/signalapp/libsignal", tag = "v0.101.2" }

# Cryptographic primitives
hkdf = "0.13"
sha2 = "0.11"
aes-gcm-siv = "0.12"

# Secure memory zeroing
zeroize = "1.7"

# UUID support for group distribution IDs
uuid = { version = "1", features = ["v4", "serde", "js"] }

# Async trait support (required by libsignal-protocol store traits)
async-trait = "0.1"

# Async runtime for sync wrappers
futures = "0.3"

# Sync primitives (not used on WASM)
once_cell = "1.19"
parking_lot = "0.12"

# WASM support - getrandom needs explicit features for browser randomness
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Two live at once, and each needs its browser backend turned on by name or
# the wasm32 build fails inside getrandom itself. Cargo unions features per
# package version, so declaring them here is what enables the backend for every
# crate in the graph that reaches them.
#
# Getting it wrong is loud rather than silently weak: getrandom `compile_error!`s
# when it has no backend for this target, so `make build-web` fails closed.
#
# 0.2 was declared here too until it was measured out: `cargo tree --target
# wasm32-unknown-unknown --edges normal -i getrandom@0.2.17` named this crate
# and nothing else, so the declaration had become 0.2's only consumer and was
# therefore the only thing holding that version in the graph at all. Removing
# it removes the version. If something reaches 0.2 again it says so loudly, by
# failing to compile without `js` — which is the same signal that put this
# comment here rather than a silent omission.
# getrandom 0.3.x (used by libsignal-core, rand_core 0.9)
getrandom = { version = "0.4", features = ["wasm_js"] }
# getrandom 0.4.x — reached through aes-gcm-siv 0.12 -> aead 0.6 ->
# crypto-common, which depends on it with no target cfg, so it is compiled for
# wasm32 as well. Nothing else in the graph names its backend — and the
# `--cfg getrandom_backend="wasm_js"` in .cargo/config.toml does NOT cover it:
# 0.4 does not recognise that value and selects its backend from the feature
# alone.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# For WASM: Use js_sys for console/timing
[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Performance"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The browser harness `make test-web` drives. Target-gated so a native
# `cargo test` does not build a browser harness it can never run.
#
# ⚠ This is NOT visible to the third-party notices gate, and does not need to
# be: `make third-party-notices` runs `cargo tree --edges normal,build`, which
# excludes EVERY dev-dependency on every target, gated or not.
wasm-bindgen-test = "0.3"

# Release profile optimizations
#
# ⚠ The absence of a `panic` key here is load-bearing. Adding
# `panic = "abort"` would trade a small binary saving for skipping unwinding
# altogether, and unwinding is what runs `Drop` — so every zeroize-on-Drop in
# this crate would silently stop happening on the one path where it matters
# most, a failure in the middle of an operation holding key material. Nothing
# would fail; the wipe would just not occur. The same applies to
# `-Cpanic=abort` in RUSTFLAGS, which bypasses this file entirely.
#
# It is a native-target statement only: `wasm32-unknown-unknown` aborts on
# panic by default (`rustc --print cfg --target wasm32-unknown-unknown` says
# `panic="abort"`), and no profile key changes that — a panic traps the module,
# destructors do not run, and anything held in linear memory stays there until
# the page is reloaded. Say so in SECURITY.md rather than assuming the profile
# covers it.
[profile.release]
lto = true        # Link-Time Optimization for smaller binaries
opt-level = "z"   # Optimize for size (important for WASM)
strip = true      # Strip debug symbols

# Turn silent integer wraparound into a deterministic panic (surfaced to Dart
# as a catchable exception via FRB) — but ONLY for this crate's own code.
# Applying overflow-checks tree-wide would change the release arithmetic of the
# audited crypto dependencies (curve25519-dalek, libsignal-protocol, …), some
# of which legitimately rely on wrapping in hot paths. Scoping keeps the
# defense-in-depth for our wrapper without touching upstream behavior.
[profile.release.package.libsignal_frb]
overflow-checks = true

# WASM-pack configuration for wasm-opt
# Enable WASM features that Rust compiler generates by default:
# - bulk-memory: memory.copy, memory.fill (standard since 2020)
# - nontrapping-float-to-int: saturating float conversions (standard since 2020)
# Required because older wasm-opt versions don't enable them by default
# All features are standard and supported by all modern browsers
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

# Suppress FRB macro warnings (known issue with flutter_rust_bridge 2.x)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
# No unsafe in hand-written code; the FRB-generated module opts out explicitly
# via #[allow(unsafe_code)] in lib.rs.
unsafe_code = "deny"
