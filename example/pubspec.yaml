name: libsignal_example
description: Interactive demo of the libsignal package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  libsignal:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # `make test-example` and `make test-example-web`: this app, with the package
  # in it, on each platform the package claims.
  integration_test:
    sdk: flutter
  # What `flutter drive` needs. On the web it is the only way to run the tests
  # above, and elsewhere it is the only way to run them in profile mode.
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
