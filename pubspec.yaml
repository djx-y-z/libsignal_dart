name: libsignal
description: Dart wrapper for libsignal. Signal Protocol implementation for end-to-end encryption, sealed sender, group messaging, and secure cryptographic operations.

version: 2.2.1
license: AGPL-3.0
repository: https://github.com/djx-y-z/libsignal_dart
homepage: https://github.com/djx-y-z/libsignal_dart
issue_tracker: https://github.com/djx-y-z/libsignal_dart/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter_rust_bridge: ^2.11.1
  # SHA256 verification for native library downloads
  crypto: ^3.0.7
  # Build hooks for automatic native library download
  hooks: ^1.0.0
  code_assets: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  coverage: ^1.15.0
  # Required by flutter_rust_bridge_codegen
  ffigen: ^20.1.1

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - rust
  - flutter-rust-bridge
  - signal
  - cryptography
  - encryption
