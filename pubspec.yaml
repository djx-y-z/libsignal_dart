name: libsignal
description: Dart wrapper for libsignal. Signal Protocol implementation for end-to-end encryption, sealed sender, group messaging, and secure cryptographic operations.

version: 2.1.0
license: AGPL-3.0
repository: https://github.com/djx-y-z/libsignal_dart
homepage: https://github.com/djx-y-z/libsignal_dart
issue_tracker: https://github.com/djx-y-z/libsignal_dart/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter_rust_bridge: ^2.11.1
  # Build hook dependencies (required for hook/build.dart)
  # These must be in dependencies, not dev_dependencies, for hooks to work
  code_assets: ^1.0.0
  hooks: ^1.0.0
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  coverage: ^1.15.0
  # Required by flutter_rust_bridge_codegen
  ffigen: ^20.1.1

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - rust
  - flutter-rust-bridge
  - security
  - cryptography
  - privacy
  - encryption
  - messaging
  - libsignal
  - signal-protocol
  - e2e-encryption
  - x3dh
  - double-ratchet
  - sealed-sender
